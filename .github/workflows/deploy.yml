name: Deploy Databricks Apps

on:
  push:
    branches:
      - dev
      - qa
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # ✅ FIXED: Proper CLI install
      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      # ✅ Optional but recommended (debug)
      - name: Verify CLI
        run: databricks --version

      - name: Set Databricks Auth
        run: |
          echo "DATABRICKS_HOST=${{ secrets.DATABRICKS_HOST }}" >> $GITHUB_ENV
          echo "DATABRICKS_TOKEN=${{ secrets.DATABRICKS_TOKEN }}" >> $GITHUB_ENV

      # DEV
      - name: Deploy DEV
        if: github.ref == 'refs/heads/dev'
        run: |
          databricks apps deploy my-app-dev \
          --json '{"git_source": {"branch": "dev", "source_code_path": "app"}, "env": {"ENV": "dev"}}'

      # QA
      - name: Deploy QA
        if: github.ref == 'refs/heads/qa'
        run: |
          databricks apps deploy my-app-qa \
          --json '{"git_source": {"branch": "qa", "source_code_path": "app"}, "env": {"ENV": "qa"}}'

      # PROD
      - name: Deploy PROD
        if: github.ref == 'refs/heads/prod'
        run: |
          databricks apps deploy my-app-prod \
          --json '{"git_source": {"branch": "prod", "source_code_path": "app"}, "env": {"ENV": "prod"}}'